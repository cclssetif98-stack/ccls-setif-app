<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تحميل التطبيق</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827;
      font-family: Tahoma, Arial, sans-serif;
      padding: 16px;
    }
    .box {
      max-width: 440px;
      width: 100%;
      background: #1f2937;
      border-radius: 16px;
      overflow: hidden;
      text-align: center;
      padding-bottom: 20px;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
    }
    .btn {
      display: inline-block;
      margin-top: 16px;
      padding: 13px 28px;
      background: #16a34a;
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="box">
    <img src="poster.jpg" alt="Poster" />
    <a href="الرابط_المباشر_للتطبيق_هنا" class="btn" download>تحميل التطبيق</a>
  </div>
</body>
</html>
